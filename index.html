<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Date Title</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
    }

    .title {
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;

      /*
        模仿右侧「Achi% 时间周期」卡片的内容位置
        文字放在左上区域，不再垂直居中
      */
      padding: 28px 28px;

      color: #1f2329;
    }

    /* 第一行：日期 */
    .date-main {
      color: #1f2329;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
      white-space: nowrap;
    }

    /* 第二行：WK */
    .date-week {
      margin-top: 14px;

      color: #8f959e;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0;
      white-space: nowrap;
    }

    /* 异常提示 */
    .error {
      color: #8f959e;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="title" id="dateTitle">
    <div class="date-main" id="dateMain">Loading...</div>
    <div class="date-week" id="dateWeek"></div>
  </div>

  <script>
    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatTodayForDisplay(date) {
      const y = date.getFullYear();
      const m = pad2(date.getMonth() + 1);
      const d = pad2(date.getDate());

      return `${y}年${m}月${d}日`;
    }

    function normalizeDate(value) {
      if (!value) return "";

      /*
        兼容：
        2025/1/1 0:00
        2025/01/01
        2025-01-01
      */
      const text = String(value)
        .trim()
        .split(" ")[0]
        .replaceAll("-", "/");

      const parts = text.split("/");

      if (parts.length < 3) return "";

      const y = parts[0];
      const m = pad2(parts[1]);
      const d = pad2(parts[2]);

      return `${y}-${m}-${d}`;
    }

    function todayKey(date) {
      const y = date.getFullYear();
      const m = pad2(date.getMonth() + 1);
      const d = pad2(date.getDate());

      return `${y}-${m}-${d}`;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);

      if (!lines.length) {
        return [];
      }

      const headers = lines[0]
        .split(",")
        .map(h => h.trim());

      return lines.slice(1).map(line => {
        const values = line
          .split(",")
          .map(v => v.trim());

        const row = {};

        headers.forEach((h, i) => {
          row[h] = values[i] || "";
        });

        return row;
      });
    }

    async function updateTitle() {
      const titleEl = document.getElementById("dateTitle");
      const dateMainEl = document.getElementById("dateMain");
      const dateWeekEl = document.getElementById("dateWeek");

      try {
        const res = await fetch(
          "./sony_calendar.csv?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!res.ok) {
          throw new Error(
            `sony_calendar.csv 请求失败：HTTP ${res.status}`
          );
        }

        const csvText = await res.text();
        const rows = parseCSV(csvText);

        const now = new Date();
        const key = todayKey(now);

        const matched = rows.find(
          row => normalizeDate(row.date) === key
        );

        if (!matched) {
          dateMainEl.className = "error";
          dateMainEl.textContent =
            `未匹配到今天：${formatTodayForDisplay(now)}`;

          dateWeekEl.textContent = "";

          return;
        }

        const displayDate = formatTodayForDisplay(now);
        const week = matched.week || "";
        const month = matched.month || "";
        const fiscalYear = matched.fiscal_year || "";

        /*
          左侧最终展示：

          2026年08月12日
          WK33

          对应右侧：

          Achi% 时间周期
          请选择
        */
        dateMainEl.className = "date-main";
        dateWeekEl.className = "date-week";

        dateMainEl.textContent = displayDate;
        dateWeekEl.textContent = week;

        /*
          如果以后想把第二行改成：
          FY26 Aug WK33

          使用：

          dateWeekEl.textContent =
            `${fiscalYear} ${month} ${week}`;
        */

      } catch (err) {
        dateMainEl.className = "error";
        dateMainEl.textContent = "sony_calendar 读取失败";

        dateWeekEl.textContent = "";

        console.error(err);
      }
    }

    // 页面打开立即更新一次
    updateTitle();

    // 每分钟自动刷新一次
    setInterval(updateTitle, 60 * 1000);
  </script>
</body>
</html>
