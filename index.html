<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Date Title</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
    }

    .title {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      box-sizing: border-box;
      padding-left: 0;
      color: #2f63d9;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .error {
      color: #999;
      font-size: 18px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="title" id="dateTitle">Loading...</div>

  <script>
    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatTodayForDisplay(date) {
      const y = date.getFullYear();
      const m = pad2(date.getMonth() + 1);
      const d = pad2(date.getDate());
      return `${y}年${m}月${d}日`;
    }

    function normalizeDate(value) {
      if (!value) return "";

      // 兼容：2025/1/1 0:00、2025/01/01、2025-01-01
      const text = String(value).trim().split(" ")[0].replaceAll("-", "/");
      const parts = text.split("/");

      if (parts.length < 3) return "";

      const y = parts[0];
      const m = pad2(parts[1]);
      const d = pad2(parts[2]);

      return `${y}-${m}-${d}`;
    }

    function todayKey(date) {
      const y = date.getFullYear();
      const m = pad2(date.getMonth() + 1);
      const d = pad2(date.getDate());
      return `${y}-${m}-${d}`;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = lines[0].split(",").map(h => h.trim());

      return lines.slice(1).map(line => {
        const values = line.split(",").map(v => v.trim());
        const row = {};
        headers.forEach((h, i) => {
          row[h] = values[i] || "";
        });
        return row;
      });
    }

    async function updateTitle() {
      const titleEl = document.getElementById("dateTitle");

      try {
        const res = await fetch("./sony_calendar.csv?t=" + Date.now());
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        const now = new Date();
        const key = todayKey(now);

        const matched = rows.find(row => normalizeDate(row.date) === key);

        if (!matched) {
          titleEl.className = "title error";
          titleEl.textContent = `未在 sony_calendar 中匹配到今天：${formatTodayForDisplay(now)}`;
          return;
        }

        const displayDate = formatTodayForDisplay(now);
        const week = matched.week || "";
        const month = matched.month || "";
        const fiscalYear = matched.fiscal_year || "";

        // 当前展示格式：2026年05月28日 WK22
        titleEl.textContent = `${displayDate} ${week}`;

        // 如果领导后面想显示 FY + 月 + 周，可以改成下面这一行：
        // titleEl.textContent = `${displayDate} ${fiscalYear} ${month} ${week}`;

      } catch (err) {
        titleEl.className = "title error";
        titleEl.textContent = "sony_calendar 读取失败";
        console.error(err);
      }
    }

    updateTitle();

    // 每分钟刷新一次，不需要你每天手动改
    setInterval(updateTitle, 60 * 1000);
  </script>
</body>
</html>
